AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Social CRM PDF rendering service - Gotenberg on ECS Fargate behind an ALB.
  Vercel calls this stack over HTTPS to convert invoice HTML to PDF.

Parameters:
  CertificateArn:
    Type: String
    Description: ARN of a validated ACM certificate for the PDF hostname (e.g. pdf.getsocialcrm.com). Must be in the same region as this stack (eu-north-1).
    AllowedPattern: ^arn:aws:acm:[a-z0-9-]+:[0-9]+:certificate/.+$

  RenderAuthToken:
    Type: String
    Description: Shared secret. Vercel will send this in the X-Render-Token header. ALB rejects requests without it. Generate with `openssl rand -hex 32`.
    MinLength: 32
    NoEcho: true

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the ALB and ECS tasks. Pick your default VPC.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different AZs. From the default VPC, pick the subnets in eu-north-1a + eu-north-1b (any two).

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: socialcrm-gotenberg ALB - accept HTTPS from internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS in
      Tags:
        - { Key: Name, Value: socialcrm-gotenberg-alb }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: socialcrm-gotenberg Fargate task - accept 3000 from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From ALB
      Tags:
        - { Key: Name, Value: socialcrm-gotenberg-task }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: socialcrm-pdf
      CapacityProviders: [FARGATE]
      Tags:
        - { Key: Name, Value: socialcrm-pdf }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/socialcrm-gotenberg
      RetentionInDays: 7

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: socialcrm-gotenberg
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '2048'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: gotenberg
          Image: gotenberg/gotenberg:8
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gotenberg
          Command:
            - gotenberg
            - --api-port=3000
            - --api-timeout=60s
            - --chromium-disable-javascript=true
            - --api-disable-health-check-logging=true

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: socialcrm-gotenberg-tg
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '10' }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: socialcrm-gotenberg-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: forbidden

  AuthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Render-Token
            Values: [!Ref RenderAuthToken]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: socialcrm-gotenberg
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: gotenberg
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200

Outputs:
  AlbDnsName:
    Description: ALB DNS name - add this as a CNAME for pdf.getsocialcrm.com in GoDaddy.
    Value: !GetAtt LoadBalancer.DNSName

  ClusterName:
    Value: !Ref Cluster

  LogGroupName:
    Value: !Ref LogGroup
